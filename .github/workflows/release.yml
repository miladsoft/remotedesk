name: Build & Release

# Runs on every commit to main:
#   - always: a fast build check (typecheck + cargo check).
#   - only when `version` in package.json is one that hasn't been tagged
#     yet: a full macOS/Windows/Linux build, published as a GitHub Release
#     for that version.
# In other words: bump "version" in package.json and push — that commit's
# release is what users get on the Releases page. Commits that don't touch
# the version just get the build check, nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "package.json version '$VERSION' is not a plain x.y.z version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-check:
    name: Build check
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          # The runner image ships a packages.microsoft.com apt source we don't
          # need; when it breaks (403 / unsigned) it fails the whole update.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

  release:
    name: Build & publish release
    needs: [version, build-check]
    if: needs.version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into project files
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # The runner image ships a packages.microsoft.com apt source we don't
          # need; when it breaks (403 / unsigned) it fails the whole update.
          sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS builds are signed but not notarized (no paid Apple Developer
      # membership). The Developer ID certificate is used while its secrets
      # are configured; otherwise the app is ad-hoc signed, which Apple
      # Silicon requires for it to launch at all. Notarization credentials
      # (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID) are deliberately never
      # passed: Tauri notarizes whenever they exist, and that needs an
      # active membership.
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with the Developer ID certificate."
            # Multi-line syntax: the base64 certificate may contain newlines.
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
            done
          else
            echo "No signing certificate configured; using ad-hoc signing."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing variables come from "Configure macOS signing" above.
          # Signs the updater artifacts (.sig files + latest.json) so the app
          # can verify update authenticity before installing one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "RemoteDesk v__VERSION__"
          releaseBody: |
            See the assets below to download RemoteDesk for your platform.

            - **macOS**: `.dmg` (universal — works on Apple Silicon and Intel)
            - **Windows**: `.msi` installer
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`

            ### First launch on macOS
            RemoteDesk isn't notarized by Apple, so macOS blocks the first launch of a freshly downloaded copy. Either:
            - open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**, or
            - run `xattr -dr com.apple.quarantine /Applications/RemoteDesk.app` in Terminal.

            This is needed only once. Updates installed from inside the app don't need it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
